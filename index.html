    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #F7F8FC;
            text-align: center;
            direction: rtl;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 88vh;
            background-image: url('IMG_6271.PNG');
            background-size: cover;
            background-position: center;
            padding-top: 50px;
            padding-right: 20px;
            padding-left: 20px;
        }

        /* تأثيرات الأنيميشن */
        .animated {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .profile-pic,
        .bouka-graphic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: -8px;
            margin-top: 40px;
        }

        .bouka-graphic {
            width: 150px;
            height: 150px;
            margin-bottom: -70px;
            margin-top: -47px;
        }

        .description, .welcome {
            font-family: "Lalezar", system-ui;
            font-size: 12px;
            color: #83AADA;
            margin-bottom: -10px;
        }

        .welcome {
            color: #C9A32D;
            font-weight: bold;
            margin-top: 20px;
        }

        .buttons-section {
            margin: 20px 0;
        }

        .button {
            font-family: "Lilita One", sans-serif;
            display: block;
            background-color: #83AADA;
            color: #F7F8FC;
            padding: 10px 20px;
            margin: 10px 0;
            border-radius: 30px;
            text-decoration: none;
            font-size: 20px;
            transition: background-color 0.3s, transform 0.5s ease-out;
            width: 280px;
        }

        .button:hover {
            background-color: #5879a1;
            transform: translateY(-3px);
        }

        .social-icons img {
            width: 25px;
            margin: 0 10px;
            transition: transform 0.4s ease-in-out;
        }

        .social-icons img:hover {
            transform: scale(1.1);
        }

        .bio-klick {
            width: 30px;
            margin: 10px 0;
        }

        .share-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #DFC781;
            color: #AB9683;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.4s ease-in-out;
        }

        .share-button:hover {
            transform: scale(1.1);
        }

        .share-button img {
            width: 24px;
            height: 24px;
        }
    .bio-klick-footer {
      text-align: center;
      margin-bottom: 5px;
      margin-top: 10px;
      direction: ltr;
    }

    .bio-klick-footer p {
      font-family: "PT Serif", serif;
      font-size: 12px;
      color: #83AADA;
      direction: ltr;
    }
    .bio-klick-link {
      text-decoration: underline;
      color: #83AADA;
      transition: transform 0.3s ease, color 0.3s ease;
      display: inline-block;
    }

    .bio-klick-link:hover {
      transform: scale(1.15);
      color: #83AADA;
    }

    <button class="share-button animated" onclick="sharePage()">
        <img src="share (1).png" alt="Share">
    </button>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let elements = document.querySelectorAll(".animated");
            elements.forEach((el, index) => {
                setTimeout(() => {
                    el.style.opacity = "1";
                    el.style.transform = "translateY(0)";
                }, index * 300);
            });

            setTimeout(function () {
                document.querySelector('.share-button').style.display = 'flex';
            }, 3500);
        });

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: "Bouka graphics",
                    text: "Check out Bouka!",
                    url: "https://bio-klick.github.io/bouka/"
                }).catch(console.error);
            } else {
                alert('Web Share API is not supported in your browser.');
            }
        }
    </script>
